<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
{{META}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/book-style.css">
{{COMPONENT_HEAD}}
</head>
<body>
<div id="ribbon"></div>

<header class="topbar">
  <div class="bar-top">
    <a class="back" href="../">← 返回首页</a>
    <span class="bar-title">《{{TITLE}}》</span>
    <span class="bar-seal" aria-hidden="true">藏</span>
  </div>
</header>

<main>
  <!-- 单屏卡片页头：纸底紧凑，不做书式深色大开篇——首屏整幅让给产品主页大图。
       kicker 走 .section-label、标题走 h2，不造新类（与 brief 同法）。
       无章节 tab、无交替节底色：一屏读完，chrome 减到只剩返回路径。 -->
  <section style="padding:56px 0 16px">
    <div class="wrap">
      <span class="section-label">{{HERO_TAG}}</span>
      <h2>{{TITLE}}</h2>
      <p class="subtitle">{{SUBTITLE}}</p>
      <p class="meta"><span>{{DATE}}</span><i>·</i><span>产品风格卡片</span>{{SERIES_BADGE}}</p>
    </div>
  </section>

  {{VOLUME_NAV}}
  {{CONTENT}}

  <footer class="colophon">
    <div class="wrap">
      <div class="book">《Vicky》· 产品风格卡片</div>
      <div class="pg">{{DATE}} · <a href="../">返回首页</a></div>
    </div>
  </footer>
</main>

<script>
/* 书签丝带 */
var ribbon=document.getElementById('ribbon');
function setRibbon(){var h=document.documentElement;ribbon.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';}
addEventListener('scroll',setRibbon,{passive:true});setRibbon();
/* 滚动进入 */
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.06}):null;
document.querySelectorAll('.reveal').forEach(function(el){if(io)io.observe(el);else el.classList.add('in');});
</script>
</body>
</html>
