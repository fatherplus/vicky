<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BOOK-STYLE · 书页模板 —— ai-report 唯一 CSS 来源
   规范见 skill/BOOK-STYLE.md（配色/字体/版式/动效均为硬约束）
   ============================================================ */
:root{
  --paper:#FBFAF7; --ink:#23272E; --sub:#6E7278;
  --accent:#0C4A6E; --seal:#A63A2E; --hairline:rgba(0,0,0,.08);
  --serif:'Noto Serif SC',serif; --sans:'Noto Sans SC',-apple-system,'PingFang SC',sans-serif;
  --mono:'JetBrains Mono','SF Mono',Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.9;font-size:16.5px;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}

/* 书签丝带（阅读进度） */
#ribbon{position:fixed;top:0;left:0;height:3px;width:0;background:var(--seal);z-index:200}

/* 书眉 */
.runninghead{position:sticky;top:0;z-index:100;background:rgba(251,250,247,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline)}
.runninghead .inner{max-width:1040px;margin:0 auto;padding:13px 32px;display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.runninghead .book{font-family:var(--serif);font-weight:600;font-size:14px;color:var(--ink);letter-spacing:.06em}
.runninghead .chapter{font-family:var(--mono);font-size:11.5px;color:var(--sub);letter-spacing:.04em;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.page{max-width:720px;margin:0 auto;padding:0 32px}

/* 章节开头 */
.opener{padding:96px 0 72px}
.opener .kicker{font-family:var(--mono);font-size:12.5px;color:var(--accent);letter-spacing:.22em;margin-bottom:26px;display:flex;align-items:center;gap:14px}
.opener .kicker::after{content:'';flex:1;height:1px;background:var(--hairline)}
.titleblock{position:relative}
.opener h1{font-family:var(--serif);font-weight:900;font-size:clamp(36px,5vw,52px);line-height:1.25;letter-spacing:.01em;margin-bottom:22px;max-width:600px}
.opener .subtitle{font-size:18px;color:var(--sub);line-height:1.7;max-width:560px}
.opener .meta{margin-top:34px;font-family:var(--mono);font-size:12.5px;color:var(--sub);letter-spacing:.04em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.opener .meta .sep{color:var(--hairline)}
/* 藏书章 */
.seal{position:absolute;top:-6px;right:0;width:64px;height:64px;background:var(--seal);color:#FBFAF7;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:26px;transform:rotate(4deg);box-shadow:0 3px 12px rgba(166,58,46,.28),inset 0 0 0 2px rgba(251,250,247,.35);user-select:none}
@media(max-width:640px){.seal{width:48px;height:48px;font-size:19px}}

/* 正文与节 */
section{padding:64px 0;border-top:1px solid var(--hairline)}
section:first-of-type{border-top:none;padding-top:8px}
.section-label{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:14px}
h2{font-family:var(--serif);font-weight:900;font-size:26px;line-height:1.35;margin-bottom:16px}
h3{font-family:var(--serif);font-weight:700;font-size:19px;margin:34px 0 12px}
p{margin-bottom:18px}
.lead{font-size:17.5px;color:var(--sub)}
strong{font-weight:700;color:var(--ink)}
a{color:var(--accent)}

/* 组件：卡片 */
.card{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:10px;padding:26px 28px;box-shadow:0 2px 10px rgba(0,0,0,.04);margin:22px 0;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.07)}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}
@media(max-width:640px){.card-grid{grid-template-columns:1fr}}
.card h4{font-family:var(--serif);font-size:17px;font-weight:700;margin-bottom:8px}
.card p{font-size:15px;color:var(--sub);margin:0}

/* 组件：三线表 */
table{width:100%;border-collapse:collapse;margin:24px 0;font-size:15px}
thead th{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sub);text-align:left;padding:10px 14px;border-bottom:2px solid var(--ink)}
tbody td{padding:12px 14px;border-bottom:1px solid var(--hairline);color:var(--ink)}
tbody tr:last-child td{border-bottom:2px solid var(--ink)}
tbody tr:hover td{background:rgba(12,74,110,.035)}
td.num,th.num{font-family:var(--mono);font-size:13.5px}

/* 组件：引用 */
blockquote{border-left:3px solid var(--accent);background:rgba(12,74,110,.045);padding:18px 24px;margin:24px 0;border-radius:0 8px 8px 0}
blockquote p{font-family:var(--serif);font-size:16.5px;color:var(--ink);margin:0;line-height:1.8}
blockquote cite{display:block;font-family:var(--mono);font-size:12px;color:var(--sub);margin-top:8px;font-style:normal}

/* 组件：代码 */
pre{background:#1D1F24;color:#E8E6E1;border-radius:10px;padding:22px 24px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.75;margin:24px 0}
code{font-family:var(--mono);font-size:.86em}
p code,li code{background:rgba(12,74,110,.07);color:var(--accent);padding:2px 7px;border-radius:5px}

/* 组件：强调框 */
.callout{border-radius:10px;padding:20px 24px;margin:24px 0;border-left:3px solid}
.callout h4{font-family:var(--serif);font-size:16px;margin-bottom:6px}
.callout p{font-size:14.5px;margin:0;line-height:1.75}
.callout.note{background:rgba(12,74,110,.05);border-color:var(--accent)}
.callout.note h4{color:var(--accent)}
.callout.warn{background:rgba(166,58,46,.06);border-color:var(--seal)}
.callout.warn h4{color:var(--seal)}

/* 组件：列表 */
ul,ol{margin:0 0 18px 26px}
li{margin-bottom:8px}
ul li::marker{color:var(--accent)}
ol{list-style:none;counter-reset:olc;margin-left:0}
ol li{counter-increment:olc;position:relative;padding-left:44px}
ol li::before{content:counter(olc,decimal-leading-zero);position:absolute;left:0;top:2px;font-family:var(--serif);font-weight:900;font-size:17px;color:var(--accent)}

/* 组件：标签 */
.tag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:3px 10px;border-radius:4px;background:rgba(12,74,110,.08);color:var(--accent)}

/* 页脚 */
.colophon{border-top:1px solid var(--hairline);padding:52px 0 64px;text-align:center}
.colophon .book{font-family:var(--serif);font-weight:600;font-size:15px;color:var(--ink);letter-spacing:.08em}
.colophon .pg{font-family:var(--mono);font-size:12px;color:var(--sub);margin-top:10px;letter-spacing:.1em}
.colophon a{color:var(--accent);text-decoration:none}

/* 动效（克制） */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="ribbon"></div>

<header class="runninghead">
  <div class="inner">
    <span class="book">《AI 研究报告集》</span>
    <span class="chapter">{{TITLE}}</span>
  </div>
</header>

<main>
  <div class="page">
    <div class="opener">
      <div class="kicker">{{HERO_TAG}}</div>
      <div class="titleblock">
        <div class="seal" aria-hidden="true">藏</div>
        <h1>{{TITLE}}</h1>
        <p class="subtitle">{{SUBTITLE}}</p>
      </div>
      <div class="meta"><span>{{DATE}}</span><span class="sep">·</span><span>{{AUTHOR}}</span><span class="sep">·</span><span>ai-report</span></div>
    </div>

    {{CONTENT}}

    <footer class="colophon">
      <div class="book">《AI 研究报告集》</div>
      <div class="pg">{{DATE}} · {{AUTHOR}} · <a href="index.html">返回目录</a></div>
    </footer>
  </div>
</main>

<script>
/* 书签丝带 */
var ribbon=document.getElementById('ribbon');
function setRibbon(){var h=document.documentElement;ribbon.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';}
addEventListener('scroll',setRibbon,{passive:true});setRibbon();
/* 滚动进入 */
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.1});
document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});
</script>
</body>
</html>
