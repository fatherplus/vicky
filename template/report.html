<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============ BOOK-STYLE · 舒展书风格（ai-report 唯一 CSS 来源）============
   宽版心 1100px · 大字号 · 章节 tab 导航 · 返回索引 · 书签丝带 · 藏书章
   规范见 skill/BOOK-STYLE.md */
:root{
  --paper:#FAF8F3; --paper-alt:#F1EDE2; --ink:#20242C; --sub:#6E7278;
  --accent:#0C4A6E; --seal:#A63A2E; --dark:#16212C; --dark2:#22303E;
  --hair:rgba(32,36,44,.07);
  --serif:'Noto Serif SC',serif; --sans:'Noto Sans SC',-apple-system,'PingFang SC',sans-serif;
  --mono:'JetBrains Mono','SF Mono',Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:17.5px;line-height:1.95;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}

/* 书签丝带 */
#ribbon{position:fixed;top:0;left:0;height:3px;width:0;background:var(--seal);z-index:300}

/* 吸顶导航：返回键 + 标题 + 印章 / 章节 tab */
.topbar{position:sticky;top:0;z-index:200;background:rgba(250,248,243,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--hair)}
.bar-top{max-width:1100px;margin:0 auto;padding:0 40px;height:54px;display:flex;align-items:center;gap:18px}
.back{font-family:var(--mono);font-size:12px;color:var(--accent);text-decoration:none;border:1px solid rgba(12,74,110,.32);padding:5px 13px;border-radius:7px;transition:all .25s;white-space:nowrap;flex-shrink:0}
.back:hover{background:var(--accent);color:#fff;transform:translateX(-2px)}
.bar-title{font-family:var(--serif);font-weight:600;font-size:15.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.bar-seal{width:30px;height:30px;background:var(--seal);color:var(--paper);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:15px;transform:rotate(3deg);flex-shrink:0;box-shadow:0 2px 8px rgba(166,58,46,.32)}
.bar-tabs{max-width:1100px;margin:0 auto;padding:0 32px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.bar-tabs::-webkit-scrollbar{display:none}
.tab{font-size:13px;color:var(--sub);text-decoration:none;padding:9px 13px;white-space:nowrap;border-bottom:2.5px solid transparent;transition:color .2s,border-color .2s;flex-shrink:0}
.tab:hover{color:var(--accent)}
.tab.on{color:var(--accent);border-bottom-color:var(--seal);font-weight:600}

.wrap{max-width:1100px;margin:0 auto;padding:0 40px}
@media(max-width:640px){.wrap{padding:0 22px}.bar-top{padding:0 22px}.bar-tabs{padding:0 14px}}

/* 章节扉页（深色） */
.opener{background:radial-gradient(1000px 620px at 82% 8%,var(--dark2),var(--dark) 62%);color:#F5F2EA;padding:128px 0 108px;position:relative;overflow:hidden}
.opener .wrap{position:relative;z-index:2}
.opener .kicker{font-family:var(--mono);font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:#8FBEDB;margin-bottom:30px;display:flex;align-items:center;gap:16px}
.opener .kicker::after{content:'';width:64px;height:1px;background:rgba(245,242,234,.32)}
.opener h1{font-family:var(--serif);font-weight:900;font-size:clamp(40px,6vw,60px);line-height:1.22;letter-spacing:.01em;max-width:840px;margin-bottom:24px}
.opener .subtitle{font-size:19px;line-height:1.75;color:rgba(245,242,234,.72);max-width:700px}
.opener .meta{margin-top:42px;font-family:var(--mono);font-size:13px;color:rgba(245,242,234,.52);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.opener .meta i{font-style:normal;color:rgba(245,242,234,.3)}
.opener .seal{position:absolute;top:112px;right:7%;width:88px;height:88px;background:var(--seal);color:var(--paper);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:38px;transform:rotate(5deg);box-shadow:0 10px 34px rgba(166,58,46,.42),inset 0 0 0 3px rgba(250,248,243,.28);z-index:2}
.opener .ghost{position:absolute;right:-50px;bottom:-90px;font-family:var(--serif);font-weight:900;font-size:340px;line-height:1;color:rgba(245,242,234,.045);z-index:1;user-select:none;pointer-events:none}
@media(max-width:760px){.opener{padding:96px 0 84px}.opener .seal{width:54px;height:54px;font-size:23px;top:auto;bottom:34px;right:22px}.opener .ghost{font-size:200px}}

/* 内容节：全宽 + 交替底色 */
main section{padding:92px 0;scroll-margin-top:118px}
main section.alt{background:var(--paper-alt)}
@media(max-width:640px){main section{padding:64px 0}}

/* 标题阶梯（大字号） */
.section-label{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:14px}
h2{font-family:var(--serif);font-weight:900;font-size:34px;line-height:1.32;letter-spacing:.01em;margin-bottom:18px}
h3{font-family:var(--serif);font-weight:700;font-size:22px;margin:40px 0 14px}
p{margin-bottom:18px}
.section-desc,.lead{font-size:18.5px;color:var(--sub);line-height:1.85}
strong{font-weight:700;color:var(--ink)}
a{color:var(--accent)}

/* 页脚（跋） */
.colophon{background:var(--dark);color:rgba(245,242,234,.6);padding:56px 0;text-align:center}
.colophon .book{font-family:var(--serif);font-weight:600;font-size:16px;color:#F5F2EA;letter-spacing:.1em}
.colophon .pg{font-family:var(--mono);font-size:12.5px;margin-top:12px}
.colophon a{color:#8FBEDB;text-decoration:none}
.colophon a:hover{text-decoration:underline}

/* ===== 旧报告组件兼容（统一为书风格）===== */
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:26px 0}
.card-grid.three-col{grid-template-columns:repeat(3,1fr)}
.card-grid.four-col{grid-template-columns:repeat(2,1fr)}
@media(max-width:860px){.card-grid.three-col{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.card-grid,.card-grid.three-col,.card-grid.four-col{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--hair);border-radius:12px;padding:30px 30px;box-shadow:0 2px 12px rgba(32,36,44,.05);transition:transform .22s,box-shadow .22s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(32,36,44,.09)}
.card-name{font-family:var(--serif);font-size:19px;font-weight:700;margin-bottom:5px}
.card-vendor{font-family:var(--mono);font-size:12px;color:var(--sub);margin-bottom:14px}
.card-desc{font-size:15.5px;color:var(--sub);line-height:1.75;margin-bottom:16px}
.card-tags{display:flex;flex-wrap:wrap;gap:8px}
.card.highlight{background:var(--accent);border-color:var(--accent)}
.card.highlight .card-name{color:#fff}
.card.highlight .card-vendor{color:rgba(255,255,255,.6)}
.card.highlight .card-desc{color:rgba(255,255,255,.85)}
.card.highlight .tag{background:rgba(255,255,255,.16);color:#fff}
.tag{display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;padding:4px 11px;border-radius:5px;background:rgba(12,74,110,.08);color:var(--accent)}
.tag.green{background:rgba(46,125,50,.1);color:#2e7d32}
.tag.amber{background:rgba(149,100,0,.12);color:#956400}
.tag.red{background:rgba(166,58,46,.1);color:var(--seal)}
.data-table{width:100%;border-collapse:collapse;margin:26px 0;font-size:15.5px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(32,36,44,.05)}
.data-table th{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--sub);text-align:left;padding:13px 18px;border-bottom:2px solid var(--ink);background:#fff}
.data-table td{padding:13px 18px;border-bottom:1px solid var(--hair)}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(12,74,110,.035)}
.data-table .name-cell{font-weight:600}
.data-table .num{font-family:var(--mono);font-size:14px}
.data-table .win{color:#2e7d32;font-weight:600}
.data-table .loss{color:var(--seal);font-weight:600}
.quote-block{border-left:3px solid var(--accent);background:rgba(12,74,110,.05);padding:22px 28px;margin:26px 0;border-radius:0 10px 10px 0}
.quote-block p{font-family:var(--serif);font-size:17.5px;line-height:1.85;margin:0}
.quote-block .attr{font-family:var(--mono);font-size:12.5px;color:var(--sub);margin-top:10px}
.code-block{background:#1D1F24;border-radius:12px;padding:24px 28px;overflow-x:auto;margin:26px 0}
.code-block pre{font-family:var(--mono);font-size:13.5px;line-height:1.8;color:#E8E6E1;white-space:pre;margin:0;background:none;padding:0}
.code-block .cm{color:#8a8f98}
pre{background:#1D1F24;color:#E8E6E1;border-radius:12px;padding:24px 28px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.8;margin:26px 0}
p code,li code{font-family:var(--mono);font-size:.85em;background:rgba(12,74,110,.08);color:var(--accent);padding:2px 7px;border-radius:5px}
.concern-box{background:rgba(166,58,46,.06);border-left:3px solid var(--seal);border-radius:0 12px 12px 0;padding:24px 28px;margin:26px 0}
.concern-box h4{font-family:var(--serif);font-size:17px;color:var(--seal);margin-bottom:8px}
.concern-box p{font-size:15.5px;line-height:1.8;margin:0}
.ladder-list{display:flex;flex-direction:column;gap:16px;margin:26px 0}
.ladder-rung{display:flex;gap:20px;align-items:flex-start;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:24px 26px;box-shadow:0 2px 12px rgba(32,36,44,.05);transition:transform .22s}
.ladder-rung:hover{transform:translateX(5px)}
.ladder-num{flex-shrink:0;width:42px;height:42px;border-radius:11px;background:var(--accent);color:#fff;font-family:var(--serif);font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center}
.ladder-content h4{font-family:var(--serif);font-size:17.5px;font-weight:700;margin-bottom:6px}
.ladder-content p{font-size:15.5px;color:var(--sub);line-height:1.75;margin:0}
.phase-list{display:flex;flex-direction:column;gap:20px;margin:26px 0}
.phase{display:flex;gap:22px;align-items:flex-start;background:#fff;border:1px solid var(--hair);border-radius:12px;padding:28px 30px;box-shadow:0 2px 12px rgba(32,36,44,.05);transition:transform .22s}
.phase:hover{transform:translateX(5px)}
.phase-num{flex-shrink:0;width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;font-family:var(--serif);font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}
.phase-content h3{font-family:var(--serif);font-size:19px;font-weight:700;margin:0 0 8px}
.phase-content p{font-size:15.5px;color:var(--sub);line-height:1.75;margin:0}
ul,ol{margin:0 0 18px 28px}
li{margin-bottom:9px}
ul li::marker{color:var(--accent)}
.container{max-width:100%;padding:0;margin:0}

/* 动效（克制） */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .65s cubic-bezier(.16,1,.3,1),transform .65s cubic-bezier(.16,1,.3,1);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style>
<style>
/* 跨页过渡（目录 → 文章）—— 浏览器原生 View Transitions API，零 JS；
   不支持的浏览器（Safari/Firefox）自动降级为直接跳转。规范见 BOOK-STYLE §8 */
@view-transition{navigation:auto}
html{background:var(--paper)}
::view-transition-image-pair(root){isolation:isolate}
::view-transition-old(root),::view-transition-new(root){mix-blend-mode:normal;animation-duration:.45s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
::view-transition-old(root){animation-name:vt-old}
::view-transition-new(root){animation-name:vt-new}
@keyframes vt-old{to{opacity:0;transform:translateX(-20px)}}
@keyframes vt-new{from{opacity:0;transform:translateX(20px)}}
@media(prefers-reduced-motion:reduce){::view-transition-old(root),::view-transition-new(root){animation:none}}
</style>
</head>
<body>
<div id="ribbon"></div>

<header class="topbar">
  <div class="bar-top">
    <a class="back" href="../index.html">← 返回目录</a>
    <span class="bar-title">《{{TITLE}}》</span>
    <span class="bar-seal" aria-hidden="true">藏</span>
  </div>
  <nav class="bar-tabs" id="tabs" aria-label="章节导航"></nav>
</header>

<main>
  <section class="opener">
    <div class="wrap">
      <div class="kicker">{{HERO_TAG}}</div>
      <h1>{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
      <div class="meta"><span>{{DATE}}</span><i>·</i><span>{{AUTHOR}}</span><i>·</i><span>AI 研究报告集</span></div>
    </div>
    <div class="seal" aria-hidden="true">藏</div>
    <div class="ghost" aria-hidden="true">藏</div>
  </section>

  {{CONTENT}}

  <footer class="colophon">
    <div class="wrap">
      <div class="book">《AI 研究报告集》</div>
      <div class="pg">{{DATE}} · {{AUTHOR}} · <a href="../index.html">返回目录</a></div>
    </div>
  </footer>
</main>

<script>
/* 书签丝带 */
var ribbon=document.getElementById('ribbon');
function setRibbon(){var h=document.documentElement;ribbon.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';}
addEventListener('scroll',setRibbon,{passive:true});setRibbon();
/* 滚动进入 */
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.06}):null;
document.querySelectorAll('.reveal').forEach(function(el){if(io)io.observe(el);else el.classList.add('in');});
/* 交替节底色 */
var secs=document.querySelectorAll('main section:not(.opener)');
for(var i=0;i<secs.length;i++){if(i%2===1)secs[i].classList.add('alt');}
/* 章节 tab（由 h2 生成）+ 滚动定位 */
var tabsEl=document.getElementById('tabs');
var heads=Array.prototype.slice.call(document.querySelectorAll('main section:not(.opener) h2'));
heads.forEach(function(h,idx){if(!h.id)h.id='sec-'+idx;
  var a=document.createElement('a');a.href='#'+h.id;a.className='tab';
  var t=h.textContent.trim();a.textContent=t.length>12?t.slice(0,12)+'…':t;
  a.title=t;tabsEl.appendChild(a);});
var tabs=Array.prototype.slice.call(tabsEl.querySelectorAll('.tab'));
function spy(){var pos=window.scrollY+160;var act=-1;
  heads.forEach(function(h,idx){var top=h.getBoundingClientRect().top+window.scrollY;if(top<=pos)act=idx;});
  tabs.forEach(function(tb,idx){tb.classList.toggle('on',idx===act);});
  if(act>=0){var tb=tabs[act],l=tb.offsetLeft,r=l+tb.offsetWidth;
    if(l<tabsEl.scrollLeft||r>tabsEl.scrollLeft+tabsEl.offsetWidth){tabsEl.scrollLeft=l-tabsEl.offsetWidth/2;}}
  window.__spyAct=act;}
addEventListener('scroll',spy,{passive:true});spy();
</script>
</body>
</html>
