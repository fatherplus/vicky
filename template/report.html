<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;color:#1d1d1f;background:#fff;line-height:1.75;-webkit-font-smoothing:antialiased}
.container{max-width:1080px;margin:0 auto;padding:0 40px}
.hero{padding:120px 0 80px;text-align:center}
.hero-tag{display:inline-block;font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#0C4A6E;margin-bottom:20px}
.hero h1{font-size:48px;font-weight:700;letter-spacing:-1px;line-height:1.2;margin-bottom:20px}
.hero .subtitle{font-size:20px;color:#6e6e73;max-width:640px;margin:0 auto;line-height:1.6}
.hero-meta{margin-top:32px;font-size:13px;color:#86868b}
section{padding:80px 0}
section+section{border-top:1px solid #f0f0f0}
.section-label{font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#0C4A6E;margin-bottom:12px}
h2{font-size:36px;font-weight:700;letter-spacing:-0.5px;margin-bottom:16px}
h3{font-size:22px;font-weight:700;margin-bottom:12px;margin-top:32px}
.section-desc{font-size:17px;color:#6e6e73;margin-bottom:48px;max-width:680px;line-height:1.7}
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.card-grid.three-col{grid-template-columns:repeat(3,1fr)}
.card-grid.four-col{grid-template-columns:repeat(4,1fr)}
.card{background:#fafafa;border-radius:18px;padding:32px;box-shadow:0 2px 12px rgba(0,0,0,0.04);transition:transform 0.2s ease,box-shadow 0.2s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.08)}
.card-name{font-size:20px;font-weight:700;margin-bottom:4px}
.card-vendor{font-size:13px;color:#86868b;margin-bottom:16px}
.card-desc{font-size:15px;color:#424245;margin-bottom:16px;line-height:1.65}
.card-tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px;background:#e8f4f8;color:#0C4A6E}
.tag.green{background:#e8f5e9;color:#2e7d32}
.tag.amber{background:#fff8e1;color:#f57f17}
.tag.red{background:#fce4ec;color:#c62828}
.card.highlight{background:linear-gradient(135deg,#0C4A6E 0%,#155E75 100%);color:#fff}
.card.highlight .card-name{color:#fff}
.card.highlight .card-vendor{color:rgba(255,255,255,0.6)}
.card.highlight .card-desc{color:rgba(255,255,255,0.85)}
.card.highlight .tag{background:rgba(255,255,255,0.15);color:#fff}
.data-table{width:100%;border-collapse:collapse;margin-top:8px}
.data-table th{font-size:13px;font-weight:600;text-align:left;color:#86868b;text-transform:uppercase;letter-spacing:0.5px;padding:12px 16px;border-bottom:2px solid #e5e5e5}
.data-table td{font-size:15px;padding:14px 16px;border-bottom:1px solid #f0f0f0;color:#424245}
.data-table tr:hover td{background:#fafafa}
.data-table .name-cell{font-weight:600;color:#1d1d1f}
.data-table .num{font-family:"SF Mono","Fira Code",monospace;font-size:14px;font-weight:600}
.data-table .win{color:#2e7d32}
.data-table .loss{color:#c62828}
.quote-block{background:#f5f5f7;border-radius:16px;padding:28px 32px;margin:24px 0;border-left:4px solid #0C4A6E}
.quote-block p{font-size:16px;color:#424245;line-height:1.7;font-style:italic}
.quote-block .attr{font-size:13px;color:#86868b;margin-top:8px}
.code-block{background:#1d1d1f;border-radius:12px;padding:24px;margin-top:24px;overflow-x:auto}
.code-block pre{font-family:"SF Mono","Fira Code",monospace;font-size:13px;color:#f5f5f7;line-height:1.7;white-space:pre}
.concern-box{background:#fffbeb;border-radius:16px;padding:28px;border:1px solid #fde68a;margin-top:24px}
.concern-box h4{font-size:16px;font-weight:700;color:#92400e;margin-bottom:8px}
.concern-box p{font-size:14px;color:#78350f;line-height:1.6}
.ladder-list{display:flex;flex-direction:column;gap:16px;margin-top:24px}
.ladder-rung{display:flex;gap:20px;align-items:flex-start;background:#fafafa;border-radius:16px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.03)}
.ladder-num{flex-shrink:0;width:44px;height:44px;border-radius:12px;background:#0C4A6E;color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ladder-content h4{font-size:16px;font-weight:700;margin-bottom:4px}
.ladder-content p{font-size:14px;color:#6e6e73;line-height:1.6}
.phase-list{display:flex;flex-direction:column;gap:24px}
.phase{background:#fafafa;border-radius:18px;padding:32px;box-shadow:0 2px 12px rgba(0,0,0,0.04);display:flex;gap:24px;align-items:flex-start}
.phase-num{flex-shrink:0;width:48px;height:48px;border-radius:14px;background:#0C4A6E;color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center}
.phase-content h3{font-size:18px;font-weight:700;margin:0 0 8px 0}
.phase-content p{font-size:15px;color:#6e6e73;line-height:1.65}
.footer{padding:60px 0;text-align:center;font-size:13px;color:#86868b;border-top:1px solid #f0f0f0}
.footer a{color:#0C4A6E;text-decoration:none}
.footer a:hover{text-decoration:underline}
@media(max-width:768px){
.hero h1{font-size:32px}
.card-grid,.card-grid.three-col,.card-grid.four-col{grid-template-columns:1fr}
.container{padding:0 20px}
.hero{padding:80px 0 60px}
section{padding:60px 0}
}
</style>
</head>
<body>

<header class="hero">
<div class="container">
<div class="hero-tag">{{HERO_TAG}}</div>
<h1>{{TITLE}}</h1>
<p class="subtitle">{{SUBTITLE}}</p>
<div class="hero-meta">{{DATE}} &middot; {{AUTHOR}} &middot; v1.0</div>
</div>
</header>

<main>
<div class="container">
{{CONTENT}}
</div>
</main>

<footer class="footer">
<div class="container">
<p>研究报告 · {{TITLE}}</p>
<p>{{DATE}} · {{AUTHOR}}</p>
</div>
</footer>

</body>
</html>
