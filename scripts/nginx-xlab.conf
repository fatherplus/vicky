# ai-report xlab-test (192.168.191.121) Nginx 配置
# 安装：/etc/nginx/conf.d/ai-report.conf（替换原有 9092 server block）
#
# 架构：server.py 只做 API（127.0.0.1:9091），Nginx 只做静态文件 + 反代

server {
    listen 9092;
    server_name _;

    # 静态文件：alias 直读 ai-report/public/
    location /research/ {
        alias /opt/ai-report/public/;
        add_header Cache-Control "no-cache";
    }

    # API 反代 → server.py（仅本地）
    location /api/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = / {
        return 302 /research/;
    }
}
