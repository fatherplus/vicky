# Vicky xlab-test (192.168.191.121) Nginx 配置（P4：纯反向代理）
# 安装：/etc/nginx/conf.d/vicky.conf（替换原有 9092 server block）
#
# P4 架构：vicky.web 绑定 127.0.0.1:9091，自伺服静态（/research/*），
# Nginx 纯反代，不再 alias 直读 /opt/vicky/public/。proxy_pass 不带 URI 部分，
# 完整原始 URI（含 /research/ 前缀）透传给 app（web.py _serve_static 剥离前缀）；
# 若在 Nginx 层剥掉前缀，页面内 ../assets/ 相对路径会 404。

server {
    listen 9092;
    server_name _;

    # 静态（/research/*）反代 → vicky.web
    location /research/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API 反代 → vicky.web（仅本地）
    location /api/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = / {
        return 302 /research/;
    }
}
