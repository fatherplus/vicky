# Vicky: Nginx 纯反向代理——app 自伺服静态，Nginx 不再 alias 直读 public/
# 安装：include 在站点 server block 中（deploy.sh 自动复制）
#
# 架构：vicky.web 绑定 0.0.0.0:9093（正门，含根级首页 /、/reports/*、/assets/* 等），
# Nginx 退化为可选纯反代。本 9090 站点只保留 /research/ 旧前缀作为兼容入口，
# proxy_pass 指向 9093；proxy_pass 不带 URI 部分——完整原始 URI（含 /research/ 前缀）
# 透传给 app，由 web.py _serve_static 剥离前缀映射到 public/。
# key 决策：前缀透传靠 app 处理、不在 Nginx 层 rewrite——alias→proxy 切换后 URL 语义零变化，
# 页面内 ../assets/ 相对路径依旧解析到 /research/assets/（若在 Nginx 剥掉前缀会 404）。

# canonical 收敛：平铺 URL 301 到 reports/（Nginx 层处理，app 不感知）
location ~ "^/research/(\d{4}-\d{2}-\d{2}-[a-z0-9-]+\.html)$" {
    return 301 /research/reports/$1;
}

# 静态（/research/*）反代 → vicky.web（9093 正门）
# Cache-Control 由 app 按文件类型自下发（html/assets no-cache，其余 max-age），Nginx 不再加头
location /research/ {
    proxy_pass http://127.0.0.1:9093;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# API 反代 → vicky.web（仅本地）
location /api/ {
    proxy_pass http://127.0.0.1:9093;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
