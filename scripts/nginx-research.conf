# ai-report canonical 收敛 + 资产缓存策略
# 安装位置：运维服务器站点 conf 中 /research/ location 之前（deploy.sh 自动复制，人工 include）
# 背景：reports/{file} 为唯一 canonical；平铺 /research/{file} 301 跳转，
#       使模板相对资源路径 ../assets/ 在唯一深度下永远正确。

location ~ "^/research/(\d{4}-\d{2}-\d{2}-[a-z0-9-]+\.html)$" {
    return 301 /research/reports/$1;
}

location /research/assets/ {
    alias /var/www/vicky/research/assets/;
    add_header Cache-Control "no-cache";
}
