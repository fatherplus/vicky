# ai-report: Nginx alias 直读 public/，API 反代 server.py
# 安装：include 在站点 server block 中（deploy.sh 自动复制）
#
# 架构：server.py 只做 API（127.0.0.1:9091），Nginx 只做静态文件 + 反代
# 不再有 sudo cp 双写——Nginx alias 直读 ai-report/public/

# canonical 收敛：平铺 URL 301 到 reports/
location ~ "^/research/(\d{4}-\d{2}-\d{2}-[a-z0-9-]+\.html)$" {
    return 301 /research/reports/$1;
}

# 静态文件：alias 直读 ai-report/public/（按环境改路径）
# 个人环境：/home/deploy/ai-report/public/
# xlab-test：/opt/ai-report/public/
location /research/ {
    alias /home/deploy/ai-report/public/;
    add_header Cache-Control "no-cache";
}

# API 反代 → server.py（仅本地）
location /api/ {
    proxy_pass http://127.0.0.1:9091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
