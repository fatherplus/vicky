<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__PROJECT_NAME__ · 架构树 — Vicky</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/index.css">
<link rel="stylesheet" href="/assets/arch.css">
<style>:root{--bar-h:52px}</style>
</head>
<body>
<header class="bar-top" style="position:fixed;top:0;left:0;right:0;height:52px;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px">
  <a href="../" style="font-family:var(--mono);font-size:13px;color:var(--accent);text-decoration:none">← 首页</a>
  <h1 style="font-family:var(--serif);font-size:17px;margin:0">__PROJECT_NAME__ · 架构树</h1>
</header>
<div class="arch-zoom">
  <button onclick="canvas.zoomBy(1.2)">＋</button>
  <button onclick="canvas.zoomBy(1/1.2)">－</button>
  <button onclick="focusEntry()">回入口</button>
</div>
<div id="viewport">
  <div id="world">
    __EDGES__
    __TREE__
  </div>
</div>

<aside id="drawer" aria-hidden="true">
  <button class="close" onclick="closeDrawer()" aria-label="关闭">×</button>
  <h3 id="drawer-title"></h3>
  <span class="kind" id="drawer-kind"></span>
  <div class="arch-body" id="drawer-body"></div>
</aside>

<script>window.ARCH_PROJECT="__PROJECT_NAME__";</script>
<script src="/assets/arch.js"></script>
<script>
var KIND_LABEL = {entry:"入口",process:"处理",storage:"存储",gateway:"网关",router:"路由",plugin:"插件",module:"模块"};
var world = document.getElementById('world');
var viewport = document.getElementById('viewport');
var canvas = archInitCanvas(world, viewport);
function redraw(){ archPositionEdges(world); }
window.addEventListener('load', function(){
  redraw();
  focusEntry();
});
function focusEntry(){
  var n = world.querySelector('.arch-node[data-kind="entry"]') || world.querySelector('.arch-node');
  if (n) canvas.focusNode(n.dataset.id, 1);
}
function openDrawer(id, label, kind){
  var d = document.getElementById('drawer');
  document.getElementById('drawer-title').textContent = label || id;
  document.getElementById('drawer-kind').textContent = KIND_LABEL[kind] || kind || "模块";
  document.getElementById('drawer-body').innerHTML = '<p class="empty">加载中…</p>';
  d.classList.add('open'); d.setAttribute('aria-hidden','false');
  fetch('/api/arch/' + encodeURIComponent(window.ARCH_PROJECT) + '/module/' + encodeURIComponent(id))
    .then(function(r){ return r.json(); })
    .then(function(data){
      var body = document.getElementById('drawer-body');
      if (data.ok && data.body_html) {
        body.innerHTML = data.body_html +
          '<a class="full" href="/arch/' + encodeURIComponent(window.ARCH_PROJECT) + '/' + encodeURIComponent(id) + '.html">查看完整子页 →</a>';
      } else {
        body.innerHTML = '<p class="empty">模块正文待补。agent 可 PUT /api/arch/' +
          encodeURIComponent(window.ARCH_PROJECT) + '/module/' + encodeURIComponent(id) + ' 写入。</p>' +
          '<a class="full" href="/arch/' + encodeURIComponent(window.ARCH_PROJECT) + '/' + encodeURIComponent(id) + '.html">打开子页 →</a>';
      }
    })
    .catch(function(){ document.getElementById('drawer-body').innerHTML = '<p class="empty">读取失败。</p>'; });
}
function closeDrawer(){
  var d = document.getElementById('drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true');
}
world.querySelectorAll('.arch-node').forEach(function(n){
  n.addEventListener('click', function(){
    canvas.focusNode(n.dataset.id);
    openDrawer(n.dataset.id, n.dataset.label, n.dataset.kind);
  });
});
</script>
</body>
</html>
