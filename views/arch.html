<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__PROJECT_NAME__ · 架构树 — Vicky</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/index.css">
<style>
#tree{position:relative}
#edges{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:0}
.arch-edge{fill:none;stroke:var(--line);stroke-width:1.5;opacity:.75}
.arch-edge-cond{font-family:var(--mono);font-size:10px;fill:var(--seal);text-anchor:middle}
.arch-node{background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--accent);
  border-radius:8px;padding:10px 14px;margin:6px;display:inline-flex;flex-direction:column;cursor:pointer;
  position:relative;z-index:1;transition:box-shadow .15s;vertical-align:top}
.arch-node:hover{box-shadow:0 4px 14px rgba(12,74,110,.14)}
.arch-node.router{border-color:var(--seal);border-left-color:var(--seal)}
.arch-node.router b{color:var(--seal)}
.arch-node-kind{font-family:var(--mono);font-size:10px;color:var(--accent);opacity:.75}
.arch-node.router .arch-node-kind{color:var(--seal)}
.arch-node b{font-size:14px}
.arch-node small{color:var(--ink-dim);font-size:12px}
.arch-layer{border-left:3px solid var(--line);padding:12px 0 12px 18px;margin-bottom:8px;position:relative;z-index:1}
/* 抽屉 */
#drawer{position:fixed;top:0;right:-460px;width:440px;max-width:92vw;height:100vh;background:#fff;
  border-left:1px solid var(--line);box-shadow:-10px 0 36px rgba(0,0,0,.09);padding:26px 26px 40px;
  overflow-y:auto;transition:right .25s ease;z-index:40}
#drawer.open{right:0}
#drawer .close{float:right;cursor:pointer;color:#b0b0b0;font-size:22px;line-height:1;border:none;background:none}
#drawer h3{font-family:var(--serif);font-size:20px;margin:0 0 4px}
#drawer .kind{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--accent);
  border:1px solid var(--line);border-radius:4px;padding:1px 7px;margin-bottom:14px}
#drawer .body{font-size:14px;line-height:1.75;color:var(--ink)}
#drawer .body h2,#drawer .body h3,#drawer .body h4{font-family:var(--serif);margin:18px 0 8px}
#drawer .body p{margin:0 0 10px}
#drawer .body ul{margin:0 0 10px;padding-left:20px}
#drawer .body code{font-family:var(--mono);font-size:12px;background:var(--bg-soft);padding:1px 5px;border-radius:4px}
#drawer .body pre{background:var(--bg-soft);border-radius:8px;padding:12px;overflow-x:auto}
#drawer .full{display:inline-block;margin-top:16px;font-size:13px;color:var(--accent);font-weight:600;text-decoration:none}
#drawer .empty{color:var(--ink-dim);font-size:13px}
</style>
</head>
<body>
<main class="page">
  <h1>__PROJECT_NAME__ · 架构树</h1>
  <p class="sub">点节点钻取模块正文；连线标注路由条件，箭头指向被调方。</p>
  <div id="tree">
    __EDGES__
    __TREE__
  </div>
</main>

<aside id="drawer" aria-hidden="true">
  <button class="close" onclick="closeDrawer()" aria-label="关闭">×</button>
  <h3 id="drawer-title"></h3>
  <span class="kind" id="drawer-kind"></span>
  <div class="body" id="drawer-body"></div>
</aside>

<script>window.ARCH_PROJECT="__PROJECT_NAME__";</script>
<script src="/assets/arch.js"></script>
<script>
var KIND_LABEL = {entry:"入口",process:"处理",storage:"存储",gateway:"网关",router:"路由",plugin:"插件",module:"模块"};
function redraw(){ archPositionEdges(document.getElementById('tree')); }
window.addEventListener('resize', redraw);
window.addEventListener('load', redraw);

function openDrawer(id, label, kind){
  var d = document.getElementById('drawer');
  document.getElementById('drawer-title').textContent = label || id;
  document.getElementById('drawer-kind').textContent = KIND_LABEL[kind] || kind || "模块";
  document.getElementById('drawer-body').innerHTML = '<p class="empty">加载中…</p>';
  d.classList.add('open'); d.setAttribute('aria-hidden','false');
  fetch('/api/arch/' + encodeURIComponent(window.ARCH_PROJECT) + '/module/' + encodeURIComponent(id))
    .then(function(r){ return r.json(); })
    .then(function(data){
      var body = document.getElementById('drawer-body');
      if(data.ok && data.body_md){
        body.innerHTML = archRenderMD(data.body_md) +
          '<a class="full" href="/arch/' + encodeURIComponent(window.ARCH_PROJECT) + '/' + encodeURIComponent(id) + '.html">查看完整子页 →</a>';
      } else {
        body.innerHTML = '<p class="empty">模块正文待补。agent 可 PUT /api/arch/' +
          encodeURIComponent(window.ARCH_PROJECT) + '/module/' + encodeURIComponent(id) + ' 写入。</p>' +
          '<a class="full" href="/arch/' + encodeURIComponent(window.ARCH_PROJECT) + '/' + encodeURIComponent(id) + '.html">打开子页 →</a>';
      }
    })
    .catch(function(){ document.getElementById('drawer-body').innerHTML = '<p class="empty">读取失败。</p>'; });
}
function closeDrawer(){
  var d = document.getElementById('drawer');
  d.classList.remove('open'); d.setAttribute('aria-hidden','true');
}
document.querySelectorAll('.arch-node').forEach(function(n){
  n.addEventListener('click', function(){ openDrawer(n.dataset.id, n.dataset.label, n.dataset.kind); });
});
</script>
</body>
</html>
