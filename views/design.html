<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品风格卡片 · 卡片墙 — Vicky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/index.css">
<style>
/* 卡片墙网格 —— 页面私有：只做结构与克制微交互，配色一律走平台 var()，不重定义 token */
.cardwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;padding:0 0 64px}
.cwall-card{display:block;text-decoration:none;color:var(--ink);background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04);transition:transform .22s cubic-bezier(.16,1,.3,1),box-shadow .22s}
.cwall-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(12,74,110,.12)}
.cwall-cover{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;border-bottom:1px solid rgba(0,0,0,.06);background:var(--paper-alt)}
.cwall-body{padding:16px 18px 18px}
.cwall-title{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.45;display:block;color:var(--ink);transition:color .2s}
.cwall-card:hover .cwall-title{color:var(--accent)}
.cwall-sub{display:block;font-size:13px;color:var(--sub);line-height:1.6;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cwall-empty{grid-column:1/-1;text-align:center;color:var(--sub);font-family:var(--serif);font-size:16px;padding:60px 0}
@media(max-width:640px){.cardwall{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="ribbon"></div>
<header class="runninghead">
  <div class="inner"><span class="book">《Vicky》</span><span class="chapter">卡片墙 · CARD WALL</span></div>
</header>

<main class="page">
  <div class="frontispiece">
    <div class="kicker">VICKY · DESIGN 素材</div>
    <div class="titleblock">
      <div class="seal" aria-hidden="true">卡</div>
      <h1>产品风格<span class="mark">卡片</span></h1>
      <p class="subtitle">一产品一卡：主页大图 + AI 风格说明。供设计师与 agent 快速对照产品的视觉语言。</p>
    </div>
    <div class="volume">
      <span class="vtag">设计素材</span><span class="sep">·</span>
      <span>__YEAR__</span><span class="sep">·</span>
      <span>共 __TOTAL__ 张</span>
    </div>
  </div>

  <div class="cardwall">
    __CARDS__
    <div class="cwall-empty" hidden>还没有产品风格卡片——以 domain=design、template=card 提交报告即可生成。</div>
  </div>

  <footer class="colophon">
    <div class="book">《Vicky》· 设计素材</div>
    <div class="pg">Vicky · <a href="/">← 返回首页</a></div>
  </footer>
</main>

<script>
var ribbon=document.getElementById('ribbon');
function setRibbon(){var h=document.documentElement;ribbon.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';}
addEventListener('scroll',setRibbon,{passive:true});setRibbon();
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.08}):null;
document.querySelectorAll('.reveal').forEach(function(el){if(io)io.observe(el);else el.classList.add('in');});
</script>
</body>
</html>
