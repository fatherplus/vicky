<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藏书楼 · 知识库 — Vicky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/knowledge.css">
</head>
<body>
<div class="wrap">
  <header class="masthead reveal">
    <div class="seal-big" aria-hidden="true">藏</div>
    <div>
      <div class="kicker">Knowledge Archive · 自动蒸馏</div>
      <h1>藏书楼</h1>
      <p class="mast-sub">从研究报告中蒸馏的可持续知识。每一页由 distill 自动运维，随报告提交而进化。</p>
    </div>
    <div class="ledger">
      <div class="stat"><span class="stat-n" data-count="__TOPICS__">0</span><span class="stat-l">知识主题</span></div>
      <div class="stat"><span class="stat-n" data-count="__SOURCES__">0</span><span class="stat-l">报告来源</span></div>
      <div class="stat"><span class="stat-n" data-count="__DISAGREE__">0</span><span class="stat-l">分歧待裁</span></div>
      <div class="stat"><span class="stat-n" data-count="__SYNTH__">0</span><span class="stat-l">已综合</span></div>
    </div>
  </header>

  <div class="toolbar reveal">
    <input id="q" class="search" type="search" placeholder="检索知识…" aria-label="检索知识">
    <div class="chips" id="chips">__CHIPS__</div>
  </div>

  <main>
__SECTIONS__
    <div id="empty">无匹配的知识条目。<span class="empty-hint">换一个专栏、标签或检索词试试。</span></div>
  </main>

  <footer class="colophon">
    <a href="/">← 返回首页</a>
    <span>知识由 <code>python3 -m vicky.cli distill</code> 自动蒸馏 · KSI 进化（AGREE · DISAGREE · SYNTHESIZE）· 生成于 __GEN__</span>
  </footer>
</div>

<script>
(function(){
  'use strict';
  var q=document.getElementById('q');
  var chips=[].slice.call(document.querySelectorAll('.chip'));
  var cat='all', tag=null;

  function tagVal(el){ return (el.dataset.t||'').trim(); }

  /* 专栏 chip × 标签 × 搜索框 三者叠加过滤 */
  function apply(){
    var term=q.value.trim().toLowerCase();
    var cards=document.querySelectorAll('.kcard');
    [].forEach.call(cards,function(c){
      var okC=cat==='all'||c.dataset.category===cat;
      var okT=!tag||(c.dataset.tags||'').split(',').map(function(s){return s.trim();}).indexOf(tag)>=0;
      var okQ=!term||(c.dataset.search||'').indexOf(term)>=0;
      c.classList.toggle('hide',!(okC&&okT&&okQ));
    });
    /* 空节隐藏 */
    [].forEach.call(document.querySelectorAll('.pavilion'),function(p){
      var any=[].some.call(p.querySelectorAll('.kcard'),function(c){return !c.classList.contains('hide');});
      p.classList.toggle('hide',!any);
    });
    /* 无结果空态 */
    var anyTotal=[].some.call(cards,function(c){return !c.classList.contains('hide');});
    document.getElementById('empty').classList.toggle('show',!anyTotal);
  }

  /* 卡片点击展开/收起（tagchip/链接不触发）*/
  [].forEach.call(document.querySelectorAll('.kcard'),function(card){
    var head=card.querySelector('.kcard-head');
    if(!head)return;
    head.setAttribute('aria-expanded','false');
    head.addEventListener('click',function(e){
      if(e.target.closest('.tagchip,a,button'))return;
      card.classList.toggle('open');
      head.setAttribute('aria-expanded',card.classList.contains('open')?'true':'false');
    });
  });

  /* 标签筛选：再次点击取消；同标签在所有卡片上同步激活态 */
  [].forEach.call(document.querySelectorAll('.tagchip'),function(t){
    t.addEventListener('click',function(e){
      e.stopPropagation();
      var v=tagVal(t);
      tag=tag===v?null:v;
      [].forEach.call(document.querySelectorAll('.tagchip'),function(x){
        x.classList.toggle('on',tag!==null&&tagVal(x)===tag);
      });
      apply();
    });
  });

  /* 专栏 chips */
  chips.forEach(function(c){c.addEventListener('click',function(){
    chips.forEach(function(x){x.classList.remove('on');});
    c.classList.add('on');
    cat=c.dataset.c;
    apply();
  });});

  /* 检索 */
  q.addEventListener('input',apply);

  /* 滚动渐显 */
  var io=new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.06});
  [].forEach.call(document.querySelectorAll('.reveal'),function(el){io.observe(el);});

  /* 计数动画 */
  [].forEach.call(document.querySelectorAll('[data-count]'),function(el){
    var target=+el.dataset.count,t0=null,dur=900;
    function tick(t){if(t0===null)t0=t;var p=Math.min(1,(t-t0)/dur);
      el.textContent=Math.round(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(tick);}
    requestAnimationFrame(tick);
  });
})();
</script>
</body>
</html>
